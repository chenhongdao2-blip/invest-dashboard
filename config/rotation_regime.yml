# 板块轮动 RRG — 周期级别水印 (护栏①) 分析师手设背景
#
# 这是「母框架」背景：RRG 是周-月级别的注意力地图，必须挂在大级别周期下读。
# George 是宏观判断主体——每周/每月手设各市场的 level + backdrop 文案。
# 缺某市场条目时，lib/regime.py 用「基准 vs 200日均线」自动兜底。
#
# level:    战略 (strategic — 轮动信号可作配置参考) | 战术 (tactical — 仅供战术抢反弹)
# backdrop: 一句话母框架背景 (康波/债务周期阶段 × 信用-盈利象限)，显示在水印条
#
# 留空 (注释掉 level) = 走 200DMA 自动兜底。

a_share:
  # level: 战术
  backdrop: ""        # 例: "朱格拉下行 + 信用扩张早期，轮动以结构为主"

hk:
  # level: 战术
  backdrop: ""        # 例: "南向流动性主导 + China discount 修复，但地缘溢价压制估值"

us:
  # level: 战略
  backdrop: ""        # 例: "AI 资本开支周期上行，但实际利率高位压制长久期"
