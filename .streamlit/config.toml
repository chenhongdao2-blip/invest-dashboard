[theme]
base = "light"
primaryColor = "#c8102e"
backgroundColor = "#fff1e5"
secondaryBackgroundColor = "#f2dfce"
textColor = "#33302e"
font = "sans serif"

# Streamlit 1.36+ official dataframe theme keys.
# bodyCellBg = theme.backgroundColor; header uses these explicit keys.
dataframeHeaderBackgroundColor = "#f2dfce"
dataframeBorderColor = "#d9c7b6"

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
