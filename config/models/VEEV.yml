# Per-model mapping config — VEEV (Veeva Systems) analyst model.
# Source: VEEV US Mar2026.xlsx (CMSI analyst model + Visible Alpha feed).
# Consumed by jobs/extract_model.py -> data/models/VEEV.json.
#
# WHY a per-model config (not a universal parser): analyst models are
# hand-built and heterogeneous (VEEV's Summary/Driver layout != GBM's
# CMS/Valuation layout). We declare cell coordinates per model; the extractor
# handles the regular period-axis discovery generically. n=1 today — ISRG/TMO
# (P1) will validate whether this config shape generalizes.

ticker: VEEV
meta:
  company: "Veeva Systems Inc."
  market: US
  currency: USD
  units: millions
  fiscal_year_end: "January 31"
  model_version: "Mar2026"
  sector: saas          # routes the L2 revenue-driver plugin (do NOT hardcode healthcare)
  source: "CMSI analyst model + Visible Alpha"
  source_file: "VEEV US Mar2026.xlsx"

# ── Period axis ──────────────────────────────────────────────────────────
# Annual FY columns live in the header row; label suffix "E" => estimate.
periods:
  sheet: Summary
  header_row: 2
  pattern: '^FY\d{2}E?$'   # annual axis (FY columns)
  # VEEV FY26 已实际报告 (Q4 FY26 ER, 2026-03-04), 但 Summary 表头仍写 "FY26E"
  # (建模时未回改)。下行把 ≤FY26 强制重分类为 actual 并去掉 "E"; FY27E 起才是预测。
  # 每年滚动: 新财年报掉后, 把这个值 +1 (e.g. 明年改 FY27)。
  actual_through: FY26
  # quarterly axis (1Q19..4Q34, same header row, same rows on Summary/Driver).
  # actual_through_q = last REPORTED fiscal quarter (4Q26 = Q4 FY26, ER 2026-03);
  # quarters at/before it are actual, later are analyst estimates. Roll +1 quarter
  # each ER. Axis is auto-trimmed to the periods where Reported Revenue is non-null.
  quarter_pattern: '^[1-4]Q\d{2}$'
  actual_through_q: 4Q26

# ── (a) Revenue breakdown ──────────────────────────────────────────────────
# Finer than Sub/Prof: the strategic 2×2 (Commercial vs R&D Solutions) × (subscription
# vs professional services), from the Driver sheet "Segment Summary" block (r55-60).
# Read by column INDEX off the Summary-derived period axis — Driver shares the same
# step-5 FY column layout (labels differ: Driver "FY26" vs Summary "FY26E", but the
# column positions match, so index-reads align).
revenue:
  sheet: Summary             # totals + total YoY (the clean curated lines)
  total_row: 22              # Reported Revenue, mm
  total_yoy_row: 14          # Y/Y Total revenue growth, %
  segment_sheet: Driver      # the 2×2 lives here (Segment Summary block)
  segments:
    - {key: comm_sub, segment: Commercial, seg_cn: "商业化", cn: "商业化·订阅", en: "Commercial · Subscription", basis: subscription, row: 55}
    - {key: comm_pro, segment: Commercial, seg_cn: "商业化", cn: "商业化·专服", en: "Commercial · Professional", basis: services, row: 56}
    - {key: rd_sub,   segment: "R&D",       seg_cn: "R&D",   cn: "R&D·订阅",   en: "R&D · Subscription",   basis: subscription, row: 58}
    - {key: rd_pro,   segment: "R&D",       seg_cn: "R&D",   cn: "R&D·专服",   en: "R&D · Professional",   basis: services, row: 59}

# ── (b) Margins ─────────────────────────────────────────────────────────────
# GAAP margins read directly from Summary; non-GAAP op/net computed from the
# non-GAAP income lines / total revenue (Summary r41/r43 ÷ r22).
margins:
  sheet: Summary
  gaap:
    - {key: gross_margin,     cn: "毛利率",   en: "Gross Margin",     row: 59}
    - {key: operating_margin, cn: "营业利润率", en: "Operating Margin", row: 60}
    - {key: net_margin,       cn: "净利率",   en: "Net Margin",       row: 62}
  non_gaap_computed:         # numerator_row / total_revenue_row
    - {key: operating_margin, cn: "营业利润率(非GAAP)", en: "Operating Margin (non-GAAP)", num_row: 41}
    - {key: net_margin,       cn: "净利率(非GAAP)",   en: "Net Margin (non-GAAP)",       num_row: 43}

# ── (c) Forecast lines (FYxxE) ──────────────────────────────────────────────
forecast:
  sheet: Summary
  lines:
    - {key: revenue,           cn: "营业收入",        en: "Revenue",            row: 22, basis: gaap}
    - {key: op_income_nongaap, cn: "营业利润(非GAAP)", en: "Op Income (non-GAAP)", row: 41, basis: non_gaap}
    - {key: net_income_nongaap, cn: "净利润(非GAAP)",  en: "Net Income (non-GAAP)", row: 43, basis: non_gaap}
    - {key: eps_nongaap,       cn: "每股收益(非GAAP)", en: "EPS (non-GAAP)",      row: 44, basis: non_gaap, unit: per_share}
    - {key: fcf,               cn: "自由现金流",      en: "Free Cash Flow",      row: 35, basis: gaap}

# ── GAAP → non-GAAP bridge (latest reported quarter) ────────────────────────
gaap_bridge:
  sheet: Beat_Miss
  period_label_cell: C37     # "4Q26"
  value_col: C
  rows:
    - {item: "GAAP 营业利润",       en: "GAAP Operating Income",        row: 38}
    - {item: "(+) 股权激励 SBC",    en: "(+) Stock-Based Comp",         row: 39}
    - {item: "(+) 购买无形摊销",    en: "(+) Amort. Purchased Intang.", row: 40}
    - {item: "(+) 诉讼和解",        en: "(+) Litigation Settlement",    row: 41}
    - {item: "= 非GAAP 营业利润",   en: "= Non-GAAP Operating Income",  row: 42, total: true}

# ── DCF + sensitivity + EV breakdown ────────────────────────────────────────
dcf:
  sheet: "Sensitivity Analysis"
  wacc_cell: D6
  terminal_growth_cell: D7
  target_price_cell: D8
  current_price_cell: D9
  ev_cell: D10
  sensitivity:
    axis_x: terminal_growth   # columns
    axis_y: wacc              # rows
    x_cells: C14:I14          # TG values
    y_cells: B15:B21          # WACC values
    grid_cells: C15:I21       # TP matrix
    base_x: 0.035
    base_y: 0.085
  ev_breakdown:               # NPV by segment (K7:M11)
    rows: "7:10"
    seg_col: K
    npv_col: L
    pct_col: M
  scenario_note_cell: B24     # analyst Chinese commentary anchor
