name: Fetch earnings calendar

# Canary-first: workflow_dispatch ONLY until a manual run proves the US runner
# reaches event.zais.minodata.com and the logs stay clean of the key. Add the
# daily cron line only after that canary passes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    concurrency:
      group: data-writer-main   # shared by ALL data-writing workflows → only one
      cancel-in-progress: false # touches main at a time (no push race / clobber)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Init schema + universe (idempotent)
        run: |
          python jobs/init_db.py
          python jobs/load_universe.py

      - name: Fetch earnings calendar
        # Key is step-scoped only; the job logs date windows and counts, never
        # headers/bodies. Public repo → these logs are public.
        env:
          MINODATA_KEY: ${{ secrets.MINODATA_KEY }}
        run: |
          python jobs/fetch_earnings_calendar.py
          python jobs/update_manifest.py earnings_calendar ok

      - name: Commit data
        run: |
          ./scripts/commit_data.sh "data: earnings calendar refresh $(date -u +%Y-%m-%d) [skip ci]" data/external/earnings_calendar.json data/refresh_manifest.json

      # C4 audit: three runs died (08-29 ×2, 09-01) leaving NO trace in the
      # manifest — the freshness audit lived INSIDE the monitored job, so when the
      # job died the audit died with it and the dashboard kept showing green.
      # This step runs on ANY prior-step failure and stamps `failed` (which does
      # NOT bump source_date), then pushes ONLY the manifest.
      #
      # ⚠ BLIND SPOT — if the step that failed is the PUSH itself, this stamp
      #   cannot land either: it calls the same commit_data.sh and fails the same
      #   way. There is no manifest row for that case and there cannot be one, so
      #   the GitHub run status is then the ONLY signal that the run died. Do not
      #   read a green manifest as proof the lane ran; read it as proof the lane
      #   ran AND could reach main.
      #
      #   Ordering matters for the same reason: `if: failure()` does not re-run
      #   setup, so this step only works because checkout and `Install deps` are
      #   already behind it (jobs/update_manifest.py imports pandas). Moving it
      #   earlier would make it die in exactly the runs it exists to record.
      - name: Stamp failure in refresh manifest
        if: failure()
        run: |
          python jobs/update_manifest.py earnings_calendar failed --note "workflow ${{ github.workflow }} run ${{ github.run_id }} failed"
          ./scripts/commit_data.sh "data: earnings calendar failure stamp $(date -u +%Y-%m-%d) [skip ci]" \
            data/refresh_manifest.json
