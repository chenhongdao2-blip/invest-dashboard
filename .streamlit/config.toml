[theme]
base = "light"
primaryColor = "#c8102e"
backgroundColor = "#fff1e5"
secondaryBackgroundColor = "#f2dfce"
textColor = "#33302e"
font = "sans serif"

# Streamlit 1.36+ official dataframe theme keys.
# bodyCellBg = theme.backgroundColor; header uses these explicit keys.
dataframeHeaderBackgroundColor = "#f2dfce"
dataframeBorderColor = "#d9c7b6"

[server]
headless = true
enableXsrfProtection = true
# Serve app/static/ at /app/static/* — self-hosted Inter/JetBrains Mono woff2
# (Google Fonts CDN is blocked for mainland-China viewers).
enableStaticServing = true

[client]
# Do NOT leak source code / tracebacks to app viewers. On error show a generic
# message; the owner still reads full errors in the Cloud logs console.
# Valid: "full" | "stacktrace" | "type" | "none".
showErrorDetails = "none"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
