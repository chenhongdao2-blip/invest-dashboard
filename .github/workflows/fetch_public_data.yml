name: Fetch public market data

# P0 pure-cloud refresh: the yfinance-sourced datasets that were written but never
# wired into CI. Runs on the GitHub ubuntu runner (US — reaches Yahoo directly, no
# proxy) and commits to main; Streamlit Cloud auto-redeploys.
#
# Covers: FX / MSCI World (benchmarks_daily), biotech price backfill (prices_daily),
# and the relative-performance US lines (hc_index_comparison.csv, --public-only so
# the local-only audited xlsx fund-positioning block is skipped).
#
# Stays out of the way of fetch_eod / fetch_sec_facts via the shared concurrency
# group `data-writer-main` (only one data-writing workflow touches main at a time),
# plus an offset cron so they don't all wake at the same minute.

on:
  schedule:
    # US close 16:00 ET → 20:00/21:00 UTC. Run 22:45 UTC (after fetch_eod's 22:30),
    # weekdays. Serialized with fetch_eod via concurrency group regardless.
    - cron: '45 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer-main
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Init schema (idempotent)
        run: python jobs/init_db.py

      - name: Load universe
        run: python jobs/load_universe.py

      - name: Load SW/HSCI sector seeds (idempotent)
        # 申万31+HSCI11 周线由本地 Wind job (jobs/pull_sw_industry_wind.py) 刷 seed
        # CSV 后 commit；这里对 committed seed 幂等入库,云端 db 不再依赖手动 db push
        run: python jobs/load_sw_industry.py

      - name: Fetch FX / MSCI World
        run: |
          python jobs/fetch_fx_world.py
          python jobs/update_manifest.py benchmarks_fx ok

      # NB: biotech prices are already refreshed daily by fetch_eod.py (full
      # universe_member). jobs/fetch_biotech_new.py is a one-off onboarding tool
      # for a specific expansion batch (reads a manual /tmp TSV) — NOT a daily job,
      # so it is intentionally not wired here.

      - name: Rebuild relative-performance (public/US panels only)
        run: |
          python jobs/build_hc_overview_data.py --public-only
          python jobs/update_manifest.py hc_index_comparison ok --note "US panels via yfinance; HK lines from committed iFind provenance"

      # 13F filings update quarterly (+45d lag, occasional /A amendments) — full
      # SEC pass Mondays / manual dispatch; other weekdays only refresh the baked
      # price series (sparkline + since-quarter-end move) via yfinance. Cheap
      # no-op commit-wise when nothing changed. US runner reaches SEC directly.
      - name: Fetch US HC funds 13F (full Mondays, prices daily)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python jobs/fetch_13f_hc_funds.py
          else
            python jobs/fetch_13f_hc_funds.py --prices-only
          fi
          python jobs/update_manifest.py us_hc_13f ok --note "SEC EDGAR 13F-HR, 12 HC-dedicated funds; prices via yfinance"

      - name: Commit data
        run: |
          ./scripts/commit_data.sh "data: public market refresh $(date -u +%Y-%m-%d) [skip ci]" \
            data/snapshots.db \
            data/refresh_manifest.json \
            data/external/hc_index_comparison.csv \
            data/external/us_hc_funds_13f.json
