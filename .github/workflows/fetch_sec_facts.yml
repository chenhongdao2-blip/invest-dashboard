name: Fetch SEC company facts

on:
  schedule:
    # SEC XBRL facts move slowly (only on new 10-Q/10-K/20-F filings).
    # Weekly is plenty — Monday 06:17 UTC (off-peak, avoids the :00 stampede).
    - cron: '17 6 * * 1'
  workflow_dispatch:               # 允许手动从 Actions tab 触发

permissions:
  contents: write                  # 允许 bot push 数据 commit

jobs:
  fetch:
    runs-on: ubuntu-latest         # US runner → reaches data.sec.gov directly, no proxy
    concurrency:
      group: data-writer-main   # shared by ALL data-writing workflows → only one
      cancel-in-progress: false # touches main at a time (no push race / clobber)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Init schema (idempotent)
        run: python jobs/init_db.py

      - name: Load universe
        run: python jobs/load_universe.py

      - name: Fetch SEC company facts
        env:
          # No SEC_PROXY here — Actions runners are in the US and reach SEC directly.
          # SEC_UA can be set to a real name+email via repo secret/variable if desired.
          # NB: value quoted — the unquoted "(contact: ...)" colon made the whole
          # workflow invalid YAML, so the schedule never ran (2026-05-30 → 2026-08-29).
          SEC_UA: "${{ vars.SEC_UA || 'invest-dashboard CI (contact: research@invest-dashboard.local)' }}"
        run: |
          python jobs/fetch_sec_facts.py
          python jobs/update_manifest.py sec_facts ok

      - name: Commit data
        # H10 audit: a naive `git add/commit/push` raced the other data lanes on
        # main; commit_data.sh does fetch → rebase → push with conflict-aware retry.
        run: |
          ./scripts/commit_data.sh "data: SEC facts refresh $(date -u +%Y-%m-%d) [skip ci]" \
            data/snapshots.db data/refresh_manifest.json

      # C4 audit: three runs died (08-29 ×2, 09-01) leaving NO trace in the
      # manifest — the freshness audit lived INSIDE the monitored job, so when the
      # job died the audit died with it and the dashboard kept showing green.
      # This step runs on ANY prior-step failure and stamps `failed` (which does
      # NOT bump source_date), then pushes ONLY the manifest.
      #
      # ⚠ BLIND SPOT — if the step that failed is the PUSH itself, this stamp
      #   cannot land either: it calls the same commit_data.sh and fails the same
      #   way. There is no manifest row for that case and there cannot be one, so
      #   the GitHub run status is then the ONLY signal that the run died. Do not
      #   read a green manifest as proof the lane ran; read it as proof the lane
      #   ran AND could reach main.
      #
      #   Ordering matters for the same reason: `if: failure()` does not re-run
      #   setup, so this step only works because checkout and `Install deps` are
      #   already behind it (jobs/update_manifest.py imports pandas). Moving it
      #   earlier would make it die in exactly the runs it exists to record.
      - name: Stamp failure in refresh manifest
        if: failure()
        run: |
          python jobs/update_manifest.py sec_facts failed --note "workflow ${{ github.workflow }} run ${{ github.run_id }} failed"
          ./scripts/commit_data.sh "data: SEC facts failure stamp $(date -u +%Y-%m-%d) [skip ci]" \
            data/refresh_manifest.json
