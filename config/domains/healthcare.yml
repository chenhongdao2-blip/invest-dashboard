# Healthcare domain config
name: Healthcare
emoji: 🏥
description: |
  Sell-side healthcare coverage across 7 sub-sectors.
  Includes US / HK / JP / KR / EU-listed tickers.

# 板块列表（按 universe YAML 命名）
sectors:
  # 顺序 = 卖方研究台习惯（制药/生物科技领先，医院服务收尾）。
  # 此 yml 是单一数据源：tab 顺序 (3_Sector_Heatmap) 与 Healthcare 页 (2_Healthcare) 同源。
  - id: pharma
    name: Pharma
    universe_file: hc_pharma.yml
    benchmark: XPH            # SPDR S&P Pharmaceuticals
  - id: biotech
    name: Biotech
    universe_file: hc_biotech.yml
    benchmark: XBI            # SPDR S&P Biotech ETF
  - id: cxo
    name: CXO & Life Sciences
    universe_file: hc_cxo.yml
    benchmark: XLV
  - id: medtech
    name: Medtech
    universe_file: hc_medtech.yml
    benchmark: IHI            # iShares US Medical Devices
  - id: hc_ai
    name: Healthcare + AI
    universe_file: hc_ai.yml
    benchmark: XLV
  - id: managed_care
    name: Managed Care
    universe_file: hc_managed_care.yml
    benchmark: IHF            # iShares US Healthcare Providers
  - id: hospital_care
    name: Hospital Care
    universe_file: hc_hospital_care.yml
    benchmark: XLV            # Health Care Select Sector SPDR

# 区域 universe（与 sectors 平级、不混 sector taxonomy）：
# 不进 7-sector 汇总表 / 热力图 tab，只供 2_Healthcare 的「日本医药」section 等
# 区域叙事用。load_universe.py 同样 ingest（DB sector_id = region id）。
regions:
  - id: japan
    name: Japan Healthcare
    universe_file: hc_japan.yml
    benchmark: 1305.T           # TOPIX ETF 代理（yfinance 无 ^TPX；1306.T 拆股断崖弃用）

# Domain-level benchmarks
benchmarks:
  primary: XLV
  secondary:
    - XBI                     # Biotech
    - XPH                     # Pharma
    - IXJ                     # iShares Global Healthcare

# CMSI 自己 cover list
coverage:
  universe_file: cmsi_coverage_hc.yml
